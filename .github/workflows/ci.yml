name: .NET CI

on:
  push:
    branches:
      - develop
      - feature/*
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Cài đặt .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # 3. Restore dependencies cho solution
      - name: Restore dependencies
        run: dotnet restore HumanResourcesManager.sln

      # 4. Build solution (Release)
      - name: Build solution
        run: dotnet build HumanResourcesManager.sln --no-restore --configuration Release

      # 5. Chạy unit tests
      - name: Run unit tests
        run: dotnet test HumanResourcesManager.Tests/HumanResourcesManager.Tests.csproj --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults
      # 6. show unit tests
      - name: Show test summary
        run: |
          [xml]$trx = Get-Content "./TestResults/test_results.trx"
          $total = $trx.TestRun.ResultSummary.Counters.total
          $passed = $trx.TestRun.ResultSummary.Counters.passed

          echo "Total tests: $total"
          echo "Passed: $passed"